# GitLab CI/CD Pipeline for {{serviceNameTitleCase}}
# Generated by Enterprise CLI - complete build, test, and deployment automation

stages:
  - validate
  - test
  - build
  - security
  - deploy-dev
  - deploy-staging
  - deploy-prod

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  DOCKER_REGISTRY: $CI_REGISTRY
  IMAGE_NAME: $CI_REGISTRY_IMAGE/{{serviceName}}
  JAVA_VERSION: "17"

cache:
  paths:
    - .m2/repository/
    - target/

# Code Quality and Validation
code-quality:
  stage: validate
  image: maven:3.9.4-openjdk-17
  script:
    - mvn $MAVEN_CLI_OPTS checkstyle:check
    - mvn $MAVEN_CLI_OPTS spotbugs:check
    - mvn $MAVEN_CLI_OPTS org.owasp:dependency-check-maven:check
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    paths:
      - target/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# SonarQube Analysis
sonarqube-check:
  stage: validate
  image: maven:3.9.4-openjdk-17
  script:
    - mvn $MAVEN_CLI_OPTS verify sonar:sonar
      -Dsonar.projectKey={{serviceName}}
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Unit Tests
unit-tests:
  stage: test
  image: maven:3.9.4-openjdk-17
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
  coverage: '/Total.*?([0-9]{1,3})%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Integration Tests
integration-tests:
  stage: test
  image: maven:3.9.4-openjdk-17
  services:
    {{#postgresql}}
    - postgres:15
    {{/postgresql}}
    {{#mysql}}
    - mysql:8.0
    {{/mysql}}
  variables:
    {{#postgresql}}
    POSTGRES_DB: {{serviceName}}_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/{{serviceName}}_test
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: password
    {{/postgresql}}
    {{#mysql}}
    MYSQL_DATABASE: {{serviceName}}_test
    MYSQL_ROOT_PASSWORD: password
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/{{serviceName}}_test
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: password
    {{/mysql}}
  script:
    - mvn $MAVEN_CLI_OPTS verify -P integration
  artifacts:
    reports:
      junit:
        - target/failsafe-reports/TEST-*.xml
    paths:
      - target/failsafe-reports/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build Application
build-app:
  stage: build
  image: maven:3.9.4-openjdk-17
  script:
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Build Docker Image
build-docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHA .
    - docker build -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:$CI_COMMIT_SHA
    - docker push $IMAGE_NAME:latest
    - |
      if [ "$CI_COMMIT_TAG" ]; then
        docker tag $IMAGE_NAME:$CI_COMMIT_SHA $IMAGE_NAME:$CI_COMMIT_TAG
        docker push $IMAGE_NAME:$CI_COMMIT_TAG
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Container Security Scanning
container-security:
  stage: security
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - trivy image --exit-code 0 --format template --template "@contrib/gitlab.tpl" -o gl-container-scanning-report.json $IMAGE_NAME:$CI_COMMIT_SHA
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $IMAGE_NAME:$CI_COMMIT_SHA
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Deploy to Development
deploy-development:
  stage: deploy-dev
  image: bitnami/kubectl:latest
  environment:
    name: development
    url: https://{{serviceName}}-dev.company.com
  before_script:
    - echo $KUBECONFIG_DEV | base64 -d > kubeconfig
    - export KUBECONFIG=kubeconfig
  script:
    - sed -i "s|company/{{serviceName}}:latest|$IMAGE_NAME:$CI_COMMIT_SHA|g" k8s/deployment.yaml
    - kubectl apply -f k8s/ -n development
    - kubectl rollout status deployment/{{serviceName}} -n development --timeout=300s
    - sleep 30
    - kubectl exec -n development deployment/{{serviceName}} -- curl -f http://localhost:8080/api/v1/actuator/health
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# Deploy to Staging
deploy-staging:
  stage: deploy-staging
  image: bitnami/kubectl:latest
  environment:
    name: staging
    url: https://{{serviceName}}-staging.company.com
  before_script:
    - echo $KUBECONFIG_STAGING | base64 -d > kubeconfig
    - export KUBECONFIG=kubeconfig
  script:
    - sed -i "s|company/{{serviceName}}:latest|$IMAGE_NAME:$CI_COMMIT_SHA|g" k8s/deployment.yaml
    - kubectl apply -f k8s/ -n staging
    - kubectl rollout status deployment/{{serviceName}} -n staging --timeout=300s
    - sleep 30
    - kubectl exec -n staging deployment/{{serviceName}} -- curl -f http://localhost:8080/api/v1/actuator/health
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Performance Testing
performance-test:
  stage: deploy-staging
  image: justb4/jmeter:5.5
  script:
    - jmeter -n -t src/test/jmeter/{{serviceName}}-performance-test.jmx -l results.jtl -e -o reports/
  artifacts:
    paths:
      - reports/
      - results.jtl
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy to Production
deploy-production:
  stage: deploy-prod
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://{{serviceName}}.company.com
  before_script:
    - echo $KUBECONFIG_PROD | base64 -d > kubeconfig
    - export KUBECONFIG=kubeconfig
  script:
    - sed -i "s|company/{{serviceName}}:latest|$IMAGE_NAME:$CI_COMMIT_TAG|g" k8s/deployment.yaml
    - kubectl apply -f k8s/ -n production
    - kubectl rollout status deployment/{{serviceName}} -n production --timeout=600s
    - sleep 60
    - kubectl exec -n production deployment/{{serviceName}} -- curl -f http://localhost:8080/api/v1/actuator/health
  when: manual
  rules:
    - if: $CI_COMMIT_TAG

# Notification
notify-success:
  stage: deploy-prod
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"{{serviceNameTitleCase}} '$CI_COMMIT_TAG' deployed to production successfully!"}' \
        $SLACK_WEBHOOK_URL
  rules:
    - if: $CI_COMMIT_TAG
  when: on_success