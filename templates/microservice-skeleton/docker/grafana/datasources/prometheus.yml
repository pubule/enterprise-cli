# Grafana Datasource Configuration for Enterprise Framework
# Generated by Enterprise CLI - Prometheus datasource for {{serviceNameTitleCase}}

apiVersion: 1

datasources:
  # Primary Prometheus instance for application metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    basicAuth: false
    withCredentials: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "300s"
      httpMethod: "POST"
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
    uid: prometheus-primary

  # Prometheus for long-term storage (if using remote storage)
  - name: Prometheus-LongTerm
    type: prometheus
    access: proxy
    url: http://prometheus-longterm:9090
    isDefault: false
    editable: true
    basicAuth: false
    withCredentials: false
    jsonData:
      timeInterval: "1m"
      queryTimeout: "600s"
      httpMethod: "POST"
    uid: prometheus-longterm

  # InfluxDB for high-resolution metrics (optional)
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: {{serviceName}}_metrics
    user: admin
    secureJsonData:
      password: password
    jsonData:
      timeInterval: "10s"
      httpMode: GET
    uid: influxdb-primary

  # Elasticsearch for log analysis
  - name: Elasticsearch-Logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "logstash-*"
    jsonData:
      interval: "Daily"
      timeField: "@timestamp"
      esVersion: 8
      maxConcurrentShardRequests: 256
      logMessageField: "message"
      logLevelField: "level"
    uid: elasticsearch-logs

  # Elasticsearch for audit trails
  - name: Elasticsearch-Audit
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "audit-events-*"
    jsonData:
      interval: "Daily"
      timeField: "timestamp"
      esVersion: 8
      maxConcurrentShardRequests: 256
      logMessageField: "eventType"
      logLevelField: "status"
    uid: elasticsearch-audit

  # Jaeger for distributed tracing (optional)
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    uid: jaeger
    jsonData:
      tracesToLogs:
        datasourceUid: elasticsearch-logs
        tags:
          - key: service.name
            value: {{serviceName}}
        mapTagNamesEnabled: true
      nodeGraph:
        enabled: true

  # TestData for demo dashboards
  - name: TestData
    type: testdata
    access: proxy
    isDefault: false
    uid: testdata

# Notification channels for alerts
notifiers:
  - name: email-alerts
    type: email
    uid: email-alerts
    org_id: 1
    is_default: true
    send_reminder: true
    frequency: "24h"
    settings:
      addresses: "admin@company.com;ops@company.com"
      subject: "{{serviceName}} Alert - {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}"
      body: |
        {{ range .Alerts }}
        Alert: {{ .Annotations.summary }}
        Description: {{ .Annotations.description }}
        Severity: {{ .Labels.severity }}
        Service: {{ .Labels.service }}
        Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
        {{ end }}

  - name: slack-alerts
    type: slack
    uid: slack-alerts
    org_id: 1
    settings:
      url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
      username: "{{serviceName}}-monitoring"
      channel: "#{{serviceName}}-alerts"
      iconEmoji: ":exclamation:"
      title: "{{serviceName}} Alert"
      text: |
        {{ range .Alerts }}
        :warning: *{{ .Annotations.summary }}*
        {{ .Annotations.description }}
        *Severity:* {{ .Labels.severity }}
        *Service:* {{ .Labels.service }}
        {{ end }}