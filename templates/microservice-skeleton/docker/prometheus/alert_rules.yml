# Prometheus Alert Rules for {{serviceNameTitleCase}}
# Generated by Enterprise CLI - Enterprise Framework alerting

groups:
  # Application Performance Alerts
  - name: enterprise.application.performance
    interval: 30s
    rules:
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, sum(rate(enterprise_service_create_time_bucket[5m])) by (le, entity)) > 2
        for: 1m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: performance
        annotations:
          summary: "High response time for {{ $labels.entity }} operations"
          description: "95th percentile response time is {{ $value }}s for {{ $labels.entity }} create operations"
          dashboard: "http://grafana:3000/d/enterprise-performance/enterprise-performance"

      - alert: CriticalResponseTime
        expr: histogram_quantile(0.95, sum(rate(enterprise_service_create_time_bucket[5m])) by (le, entity)) > 5
        for: 30s
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: performance
        annotations:
          summary: "Critical response time for {{ $labels.entity }} operations"
          description: "95th percentile response time is {{ $value }}s for {{ $labels.entity }} create operations"

      - alert: HighThroughput
        expr: sum(rate(enterprise_service_operations_total[5m])) by (entity) > 1000
        for: 2m
        labels:
          severity: info
          service: '{{serviceName}}'
          category: performance
        annotations:
          summary: "High throughput detected for {{ $labels.entity }}"
          description: "{{ $labels.entity }} operations are processing {{ $value }} requests per second"

  # Application Error Alerts
  - name: enterprise.application.errors
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: (sum(rate(enterprise_service_errors_total[5m])) by (entity) / sum(rate(enterprise_service_operations_total[5m])) by (entity)) * 100 > 5
        for: 2m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: errors
        annotations:
          summary: "High error rate for {{ $labels.entity }} operations"
          description: "Error rate is {{ $value }}% for {{ $labels.entity }} operations in the last 5 minutes"

      - alert: CriticalErrorRate
        expr: (sum(rate(enterprise_service_errors_total[5m])) by (entity) / sum(rate(enterprise_service_operations_total[5m])) by (entity)) * 100 > 15
        for: 1m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: errors
        annotations:
          summary: "Critical error rate for {{ $labels.entity }} operations"
          description: "Error rate is {{ $value }}% for {{ $labels.entity }} operations in the last 5 minutes"

      - alert: ValidationErrorSpike
        expr: increase(enterprise_service_validation_error[1h]) > 100
        for: 5m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: validation
        annotations:
          summary: "High number of validation errors"
          description: "{{ $value }} validation errors in the last hour for {{ $labels.entity }}"

      - alert: SystemErrorSpike
        expr: increase(enterprise_service_system_error[30m]) > 10
        for: 2m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: system
        annotations:
          summary: "System error spike detected"
          description: "{{ $value }} system errors in the last 30 minutes for {{ $labels.entity }}"

  # Business Logic Alerts
  - name: enterprise.business.rules
    interval: 60s
    rules:
      - alert: BusinessRuleViolationSpike
        expr: increase(enterprise_service_business_rule_violation[1h]) > 50
        for: 5m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: business
        annotations:
          summary: "High number of business rule violations"
          description: "{{ $value }} business rule violations in the last hour for {{ $labels.entity }}"

      - alert: CriticalBusinessRuleViolations
        expr: increase(enterprise_service_business_rule_violation[15m]) > 20
        for: 2m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: business
        annotations:
          summary: "Critical business rule violation rate"
          description: "{{ $value }} business rule violations in the last 15 minutes for {{ $labels.entity }}"

  # Cache Performance Alerts
  - name: enterprise.cache.performance
    interval: 60s
    rules:
      - alert: LowCacheHitRate
        expr: (sum(rate(enterprise_cache_hit[5m])) / (sum(rate(enterprise_cache_hit[5m])) + sum(rate(enterprise_cache_miss[5m])))) * 100 < 70
        for: 5m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value }}% for {{ $labels.entity }}"

      - alert: CriticalCacheHitRate
        expr: (sum(rate(enterprise_cache_hit[5m])) / (sum(rate(enterprise_cache_hit[5m])) + sum(rate(enterprise_cache_miss[5m])))) * 100 < 50
        for: 2m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: cache
        annotations:
          summary: "Critical cache hit rate"
          description: "Cache hit rate is {{ $value }}% for {{ $labels.entity }}"

  # JVM Resource Alerts
  - name: enterprise.jvm.resources
    interval: 60s
    rules:
      - alert: HighMemoryUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 80
        for: 3m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: resources
        annotations:
          summary: "High JVM heap memory usage"
          description: "JVM heap memory usage is {{ $value }}%"

      - alert: CriticalMemoryUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 95
        for: 1m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: resources
        annotations:
          summary: "Critical JVM heap memory usage"
          description: "JVM heap memory usage is {{ $value }}%"

      - alert: HighGCTime
        expr: rate(jvm_gc_collection_seconds_sum[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: gc
        annotations:
          summary: "High garbage collection time"
          description: "GC is consuming {{ $value }}s per second"

  # Database Connection Alerts
  - name: enterprise.database.connections
    interval: 60s
    rules:
      - alert: HighDatabaseConnections
        expr: (hikaricp_connections_active / hikaricp_connections_max) * 100 > 80
        for: 3m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: database
        annotations:
          summary: "High database connection pool usage"
          description: "Database connection pool usage is {{ $value }}%"

      - alert: CriticalDatabaseConnections
        expr: (hikaricp_connections_active / hikaricp_connections_max) * 100 > 95
        for: 1m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: database
        annotations:
          summary: "Critical database connection pool usage"
          description: "Database connection pool usage is {{ $value }}%"

      - alert: DatabaseConnectionTimeout
        expr: increase(hikaricp_connections_timeout_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: database
        annotations:
          summary: "Database connection timeouts detected"
          description: "{{ $value }} database connection timeouts in the last 5 minutes"

  # Application Health Alerts
  - name: enterprise.application.health
    interval: 30s
    rules:
      - alert: ApplicationDown
        expr: up{job="enterprise-app"} == 0
        for: 30s
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: health
        annotations:
          summary: "Application is down"
          description: "{{serviceName}} application is not responding"

      - alert: ApplicationHealthCheck
        expr: enterprise_health != 1
        for: 1m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: health
        annotations:
          summary: "Application health check failing"
          description: "{{serviceName}} health check is failing"

  # External Dependencies Alerts
  - name: enterprise.external.dependencies
    interval: 60s
    rules:
      - alert: DatabaseDown
        expr: up{job="postgresql"} == 0 or up{job="mysql"} == 0
        for: 30s
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: database
        annotations:
          summary: "Database is down"
          description: "Primary database for {{serviceName}} is not responding"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: cache
        annotations:
          summary: "Redis cache is down"
          description: "Redis cache for {{serviceName}} is not responding"

      - alert: RabbitMQDown
        expr: up{job="rabbitmq"} == 0
        for: 1m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: messaging
        annotations:
          summary: "RabbitMQ is down"
          description: "RabbitMQ message queue for {{serviceName}} is not responding"