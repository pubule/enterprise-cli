# Business-Specific Alert Rules for {{serviceNameTitleCase}}
# Generated by Enterprise CLI - Customize for your business requirements

groups:
  # Business KPI Alerts
  - name: enterprise.business.kpis
    interval: 60s
    rules:
      # {{domainTitleCase}} Business Metrics
      - alert: Low{{domainTitleCase}}CreationRate
        expr: sum(rate({{domain}}_created[1h])) < 10
        for: 15m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: business_kpi
        annotations:
          summary: "Low {{domain}} creation rate"
          description: "Only {{ $value }} {{domain}}s created in the last hour"

      - alert: High{{domainTitleCase}}ErrorRate
        expr: sum(rate({{domain}}_errors[5m])) / sum(rate({{domain}}_created[5m])) * 100 > 10
        for: 5m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: business_quality
        annotations:
          summary: "High {{domain}} error rate"
          description: "{{domainTitleCase}} error rate is {{ $value }}%"

      # Revenue and Financial Metrics (customize based on your business)
      - alert: LowRevenueImpact
        expr: sum(increase({{domain}}_potential_revenue[1h])) < 1000
        for: 30m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: revenue
        annotations:
          summary: "Low revenue impact from {{domain}} operations"
          description: "{{domainTitleCase}} revenue impact is only ${{ $value }} in the last hour"

      - alert: HighValueTransaction
        expr: {{domain}}_business_transaction_value > 10000
        for: 0s
        labels:
          severity: info
          service: '{{serviceName}}'
          category: high_value
        annotations:
          summary: "High value {{domain}} transaction"
          description: "{{domainTitleCase}} transaction of ${{ $value }} detected"

  # User Engagement Alerts
  - name: enterprise.user.engagement
    interval: 120s
    rules:
      - alert: LowUserEngagement
        expr: sum(rate({{domain}}_user_engagement[1h])) < 50
        for: 30m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: user_engagement
        annotations:
          summary: "Low user engagement with {{domain}} features"
          description: "User engagement rate is {{ $value }} interactions per hour"

      - alert: HighUserEngagement
        expr: sum(rate({{domain}}_user_engagement[5m])) > 500
        for: 10m
        labels:
          severity: info
          service: '{{serviceName}}'
          category: user_engagement
        annotations:
          summary: "High user engagement with {{domain}} features"
          description: "User engagement rate is {{ $value }} interactions per 5 minutes"

      - alert: SuspiciousUserActivity
        expr: sum(rate({{domain}}_user_engagement{operation="admin"}[5m])) by (user) > 100
        for: 5m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: security
        annotations:
          summary: "Suspicious admin activity detected"
          description: "User {{ $labels.user }} performed {{ $value }} admin operations in 5 minutes"

  # Inventory and Stock Alerts (example for product domain)
  - name: enterprise.inventory.management
    interval: 300s
    rules:
      - alert: LowStockAlert
        expr: {{domain}}_inventory_low_stock_count > 10
        for: 5m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: inventory
        annotations:
          summary: "Multiple items with low stock"
          description: "{{ $value }} {{domain}}s have low stock levels"

      - alert: CriticalStockAlert
        expr: {{domain}}_inventory_out_of_stock_count > 0
        for: 1m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: inventory
        annotations:
          summary: "Items out of stock"
          description: "{{ $value }} {{domain}}s are completely out of stock"

      - alert: InventoryTurnoverRate
        expr: sum(rate({{domain}}_inventory_turnover[24h])) < 0.1
        for: 2h
        labels:
          severity: info
          service: '{{serviceName}}'
          category: inventory
        annotations:
          summary: "Low inventory turnover rate"
          description: "{{domainTitleCase}} inventory turnover rate is {{ $value }} per day"

  # Data Quality Alerts
  - name: enterprise.data.quality
    interval: 300s
    rules:
      - alert: IncompleteData
        expr: {{domain}}_data_completeness_percentage < 90
        for: 10m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: data_quality
        annotations:
          summary: "{{domainTitleCase}} data completeness below threshold"
          description: "{{domainTitleCase}} data completeness is {{ $value }}%"

      - alert: DataValidationFailures
        expr: increase({{domain}}_data_validation_failures[1h]) > 50
        for: 5m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: data_quality
        annotations:
          summary: "High number of data validation failures"
          description: "{{ $value }} data validation failures in the last hour"

      - alert: DuplicateDataDetected
        expr: {{domain}}_duplicate_records_count > 0
        for: 5m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: data_quality
        annotations:
          summary: "Duplicate {{domain}} records detected"
          description: "{{ $value }} duplicate {{domain}} records found"

  # SLA and Performance KPIs
  - name: enterprise.sla.monitoring
    interval: 60s
    rules:
      - alert: SLABreach
        expr: histogram_quantile(0.95, sum(rate(enterprise_service_create_time_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: sla
        annotations:
          summary: "SLA breach: 95th percentile response time"
          description: "95th percentile response time is {{ $value }}s, exceeding 1s SLA"

      - alert: AvailabilityBreach
        expr: (sum(rate(enterprise_service_operations_total[5m])) - sum(rate(enterprise_service_errors_total[5m]))) / sum(rate(enterprise_service_operations_total[5m])) * 100 < 99.9
        for: 5m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: sla
        annotations:
          summary: "Service availability below 99.9%"
          description: "Service availability is {{ $value }}% in the last 5 minutes"

      - alert: ThroughputBelowBaseline
        expr: sum(rate(enterprise_service_operations_total[5m])) < 10
        for: 15m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: performance
        annotations:
          summary: "Throughput below baseline"
          description: "Current throughput is {{ $value }} requests/second"

  # Business Process Monitoring
  - name: enterprise.business.processes
    interval: 300s
    rules:
      - alert: LongRunningProcess
        expr: {{domain}}_process_duration_seconds > 3600
        for: 1m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: process
        annotations:
          summary: "Long running {{domain}} process detected"
          description: "{{domainTitleCase}} process has been running for {{ $value }} seconds"

      - alert: ProcessFailureRate
        expr: sum(rate({{domain}}_process_failures[5m])) / sum(rate({{domain}}_process_starts[5m])) * 100 > 5
        for: 10m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: process
        annotations:
          summary: "High process failure rate"
          description: "{{domainTitleCase}} process failure rate is {{ $value }}%"

      - alert: ProcessBacklogAlert
        expr: {{domain}}_process_queue_size > 1000
        for: 10m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: process
        annotations:
          summary: "{{domainTitleCase}} process backlog building up"
          description: "{{ $value }} {{domain}} processes in queue"

  # Compliance and Audit Alerts
  - name: enterprise.compliance.monitoring
    interval: 300s
    rules:
      - alert: UnauthorizedDataAccess
        expr: increase(enterprise_security_unauthorized_access[1h]) > 5
        for: 1m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: security
        annotations:
          summary: "Multiple unauthorized access attempts"
          description: "{{ $value }} unauthorized access attempts in the last hour"

      - alert: AuditLogGap
        expr: absent_over_time(enterprise_audit_events_total[5m])
        for: 5m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: compliance
        annotations:
          summary: "Audit logging gap detected"
          description: "No audit events recorded for 5 minutes"

      - alert: PrivilegeEscalationAttempt
        expr: increase(enterprise_security_privilege_escalation[1h]) > 1
        for: 1m
        labels:
          severity: critical
          service: '{{serviceName}}'
          category: security
        annotations:
          summary: "Privilege escalation attempt detected"
          description: "{{ $value }} privilege escalation attempts in the last hour"

  # Custom Business Rules (Template - Customize for your domain)
  - name: enterprise.custom.business
    interval: 120s
    rules:
      # Example: Order value thresholds
      - alert: HighValueOrder
        expr: {{domain}}_order_value > 5000
        for: 0s
        labels:
          severity: info
          service: '{{serviceName}}'
          category: business_rule
        annotations:
          summary: "High value order requires approval"
          description: "Order value of ${{ $value }} exceeds approval threshold"

      # Example: Geographic anomaly detection
      - alert: UnusualGeographicActivity
        expr: sum(rate({{domain}}_geographic_activity[1h])) by (country) > 100
        for: 30m
        labels:
          severity: info
          service: '{{serviceName}}'
          category: geographic
        annotations:
          summary: "High activity from {{ $labels.country }}"
          description: "{{ $value }} {{domain}} activities from {{ $labels.country }} in the last hour"

      # Example: Seasonal pattern deviation
      - alert: SeasonalPatternDeviation
        expr: abs({{domain}}_current_rate - {{domain}}_seasonal_baseline) / {{domain}}_seasonal_baseline * 100 > 50
        for: 60m
        labels:
          severity: warning
          service: '{{serviceName}}'
          category: seasonal
        annotations:
          summary: "{{domainTitleCase}} activity deviates from seasonal pattern"
          description: "Current activity is {{ $value }}% different from seasonal baseline"