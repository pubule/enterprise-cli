# Prometheus Configuration for {{serviceNameTitleCase}} Monitoring
# Generated by Enterprise CLI - Enterprise Framework monitoring stack

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'enterprise-development'
    service: '{{serviceName}}'

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'
rule_files:
  - "alert_rules.yml"
  - "business_rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configuration for all Enterprise Framework targets
scrape_configs:
  # Enterprise Application Metrics
  - job_name: 'enterprise-app'
    metrics_path: '/api/v1/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['{{serviceName}}:8080']
    scrape_timeout: 5s
    honor_labels: true
    params:
      format: ['prometheus']
    metric_relabel_configs:
      # Add service label to all metrics
      - source_labels: [__name__]
        target_label: service
        replacement: '{{serviceName}}'

      # Rename enterprise metrics for consistency
      - source_labels: [__name__]
        regex: 'enterprise_service_(.+)'
        target_label: __name__
        replacement: 'enterprise_${1}'

  # Spring Boot Actuator Health Checks
  - job_name: 'enterprise-health'
    metrics_path: '/api/v1/actuator/health'
    scrape_interval: 30s
    static_configs:
      - targets: ['{{serviceName}}:8080']
    metric_relabel_configs:
      - source_labels: [status]
        target_label: health_status
      - source_labels: [__name__]
        target_label: __name__
        replacement: 'enterprise_health'

  # JVM Metrics (Micrometer)
  - job_name: 'enterprise-jvm'
    metrics_path: '/api/v1/actuator/prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['{{serviceName}}:8080']
    metric_relabel_configs:
      # Filter only JVM metrics
      - source_labels: [__name__]
        regex: 'jvm_.*'
        action: keep
      - source_labels: [__name__]
        target_label: service
        replacement: '{{serviceName}}'

  # Database Metrics (HikariCP)
  - job_name: 'enterprise-database'
    metrics_path: '/api/v1/actuator/prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['{{serviceName}}:8080']
    metric_relabel_configs:
      # Filter only database connection pool metrics
      - source_labels: [__name__]
        regex: 'hikaricp_.*'
        action: keep

  {{#postgresql}}
  # PostgreSQL Database Metrics
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    metric_relabel_configs:
      - source_labels: [__name__]
        target_label: service
        replacement: '{{serviceName}}-postgres'
  {{/postgresql}}

  {{#mysql}}
  # MySQL Database Metrics
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']
    scrape_interval: 30s
    metric_relabel_configs:
      - source_labels: [__name__]
        target_label: service
        replacement: '{{serviceName}}-mysql'
  {{/mysql}}

  # Redis Cache Metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
    metric_relabel_configs:
      - source_labels: [__name__]
        target_label: service
        replacement: '{{serviceName}}-redis'

  # RabbitMQ Message Queue Metrics
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    scrape_interval: 30s
    metric_relabel_configs:
      - source_labels: [__name__]
        target_label: service
        replacement: '{{serviceName}}-rabbitmq'

  # Node Exporter for System Metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Cadvisor for Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: compose_service
      - source_labels: [container_label_com_docker_compose_project]
        target_label: compose_project

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # Grafana Metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

# Remote write configuration for long-term storage (optional)
# remote_write:
#   - url: "https://prometheus-remote-write.example.com/api/v1/write"
#     basic_auth:
#       username: "username"
#       password: "password"

# Storage configuration
storage:
  tsdb:
    retention.time: 15d
    retention.size: 10GB
    path: /prometheus
    wal-compression: true