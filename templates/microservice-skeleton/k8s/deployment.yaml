# Kubernetes Deployment for {{serviceNameTitleCase}}
# Generated by Enterprise CLI - production-ready configuration

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{serviceName}}
  namespace: default
  labels:
    app: {{serviceName}}
    version: v1
    component: microservice
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: {{serviceName}}
      version: v1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{serviceName}}
        version: v1
        component: microservice
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: {{serviceName}}-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: {{serviceName}}
        image: company/{{serviceName}}:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: management
          containerPort: 8080
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SERVER_PORT
          value: "8080"
        {{#postgresql}}
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: {{serviceName}}-db-secret
              key: database-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{serviceName}}-db-secret
              key: database-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{serviceName}}-db-secret
              key: database-password
        {{/postgresql}}
        {{#mysql}}
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: {{serviceName}}-db-secret
              key: database-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{serviceName}}-db-secret
              key: database-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{serviceName}}-db-secret
              key: database-password
        {{/mysql}}
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "health,info,metrics,prometheus"
        - name: JAVA_OPTS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
        envFrom:
        - configMapRef:
            name: {{serviceName}}-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/actuator/health/liveness
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/actuator/health/readiness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/v1/actuator/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: app-logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - {{serviceName}}
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{serviceName}}-sa
  namespace: default
  labels:
    app: {{serviceName}}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{serviceName}}-config
  namespace: default
  labels:
    app: {{serviceName}}
data:
  APP_NAME: "{{serviceNameTitleCase}}"
  APP_VERSION: "1.0.0"
  APP_DESCRIPTION: "Enterprise {{domainTitleCase}} Microservice"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_SHOW_SQL: "false"
  LOGGING_LEVEL_{{packageName}}: "INFO"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: "WARN"

{{#postgresql}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{serviceName}}-db-secret
  namespace: default
  labels:
    app: {{serviceName}}
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  database-url: amRiYzpwb3N0Z3Jlc3FsOi8vcG9zdGdyZXM6NTQzMi97e3NlcnZpY2VOYW1lfX1fcHJvZA==
  database-username: cG9zdGdyZXM=
  database-password: cGFzc3dvcmQ=
{{/postgresql}}

