# Kubernetes Ingress for {{serviceNameTitleCase}}
# Generated by Enterprise CLI - manages external HTTP access

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{serviceName}}-ingress
  namespace: default
  labels:
    app: {{serviceName}}
    component: microservice
    tier: backend
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    nginx.ingress.kubernetes.io/rate-limit-requests-per-minute: "100"

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://company.com,https://*.company.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"

    # Security headers
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Content-Type-Options nosniff;
      add_header X-Frame-Options DENY;
      add_header X-XSS-Protection "1; mode=block";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # AWS Load Balancer Controller annotations (alternative to NGINX)
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/healthcheck-path: /api/v1/actuator/health
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:region:account:certificate/cert-id
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - {{serviceName}}.company.com
    - api.company.com
    secretName: {{serviceName}}-tls-secret
  rules:
  # Production domain
  - host: {{serviceName}}.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{serviceName}}-service
            port:
              number: 80

  # API Gateway domain
  - host: api.company.com
    http:
      paths:
      - path: /{{serviceName}}
        pathType: Prefix
        backend:
          service:
            name: {{serviceName}}-service
            port:
              number: 80

  # Development/staging domains
  - host: {{serviceName}}-dev.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{serviceName}}-service
            port:
              number: 80

---
# TLS Certificate Secret (example - replace with actual certificate)
apiVersion: v1
kind: Secret
metadata:
  name: {{serviceName}}-tls-secret
  namespace: default
  labels:
    app: {{serviceName}}
type: kubernetes.io/tls
data:
  # Replace with actual base64-encoded certificate and key
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...

---
# Network Policy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{serviceName}}-network-policy
  namespace: default
  labels:
    app: {{serviceName}}
spec:
  podSelector:
    matchLabels:
      app: {{serviceName}}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  # Allow traffic from monitoring namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  # Allow traffic from same namespace
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow database access
  {{#postgresql}}
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  {{/postgresql}}
  {{#mysql}}
  - to:
    - podSelector:
        matchLabels:
          app: mysql
    ports:
    - protocol: TCP
      port: 3306
  {{/mysql}}