# ═══════════════════════════════════════════════════════════════
# Kubernetes Deployment for {{domainTitleCase}} Microservice
# Enterprise Framework v{{frameworkVersion}}
# ═══════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{serviceName}}
  labels:
    app: {{serviceName}}
    version: v1
    tier: backend
    framework: enterprise-framework
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{serviceName}}
  template:
    metadata:
      labels:
        app: {{serviceName}}
        version: v1
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: {{serviceName}}
          image: {{serviceName}}:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            {{#postgresql}}
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{serviceName}}-config
                  key: database.host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{serviceName}}-config
                  key: database.port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{serviceName}}-config
                  key: database.name
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{serviceName}}-secret
                  key: database.username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{serviceName}}-secret
                  key: database.password
            {{/postgresql}}
            {{#mysql}}
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{serviceName}}-config
                  key: database.host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{serviceName}}-config
                  key: database.port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{serviceName}}-config
                  key: database.name
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{serviceName}}-secret
                  key: database.username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{serviceName}}-secret
                  key: database.password
            {{/mysql}}
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
