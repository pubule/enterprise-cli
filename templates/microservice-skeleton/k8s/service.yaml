# Kubernetes Service for {{serviceNameTitleCase}}
# Generated by Enterprise CLI - exposes the application within the cluster

apiVersion: v1
kind: Service
metadata:
  name: {{serviceName}}-service
  namespace: default
  labels:
    app: {{serviceName}}
    component: microservice
    tier: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: ClusterIP
  selector:
    app: {{serviceName}}
    version: v1
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: management
    port: 8080
    targetPort: management
    protocol: TCP
  sessionAffinity: None

---
# Headless Service for StatefulSet or direct pod access
apiVersion: v1
kind: Service
metadata:
  name: {{serviceName}}-headless
  namespace: default
  labels:
    app: {{serviceName}}
    component: microservice
    tier: backend
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: {{serviceName}}
    version: v1
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP

---
# LoadBalancer Service for external access (optional)
apiVersion: v1
kind: Service
metadata:
  name: {{serviceName}}-lb
  namespace: default
  labels:
    app: {{serviceName}}
    component: microservice
    tier: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  selector:
    app: {{serviceName}}
    version: v1
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: None
  externalTrafficPolicy: Local