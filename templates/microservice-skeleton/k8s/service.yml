# ═══════════════════════════════════════════════════════════════
# Kubernetes Service for {{domainTitleCase}} Microservice
# Enterprise Framework v{{frameworkVersion}}
# ═══════════════════════════════════════════════════════════════

apiVersion: v1
kind: Service
metadata:
  name: {{serviceName}}
  labels:
    app: {{serviceName}}
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: {{serviceName}}
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  sessionAffinity: None

---

# ═══════════════════════════════════════════════════════════════
# Headless Service (for StatefulSet if needed)
# ═══════════════════════════════════════════════════════════════

apiVersion: v1
kind: Service
metadata:
  name: {{serviceName}}-headless
  labels:
    app: {{serviceName}}
    tier: backend
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: {{serviceName}}
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
