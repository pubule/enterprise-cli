# ═══════════════════════════════════════════════════════════════
# Docker Compose for {{domainTitleCase}} Microservice
# Enterprise Framework v{{frameworkVersion}}
# ═══════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────
  # Application Service
  # ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: {{serviceName}}:latest
    container_name: {{serviceName}}-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      {{#postgresql}}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME={{domain}}_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      {{/postgresql}}
      {{#mysql}}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME={{domain}}_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      {{/mysql}}
      - JAVA_OPTS=-Xms256m -Xmx512m
    depends_on:
      {{#postgresql}}
      postgres:
        condition: service_healthy
      {{/postgresql}}
      {{#mysql}}
      mysql:
        condition: service_healthy
      {{/mysql}}
    networks:
      - {{serviceName}}-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  {{#postgresql}}
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: {{serviceName}}-postgres
    environment:
      - POSTGRES_DB={{domain}}_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - {{serviceName}}-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  {{/postgresql}}

  {{#mysql}}
  # ─────────────────────────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: {{serviceName}}-mysql
    environment:
      - MYSQL_DATABASE={{domain}}_db
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - {{serviceName}}-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  {{/mysql}}

# ═══════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════
networks:
  {{serviceName}}-network:
    driver: bridge

# ═══════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════
volumes:
  {{#postgresql}}
  postgres-data:
    driver: local
  {{/postgresql}}
  {{#mysql}}
  mysql-data:
    driver: local
  {{/mysql}}
