# Simplified Docker Compose for {{serviceNameTitleCase}} Development
# Generated by Enterprise CLI - minimal setup for local development

version: '3.8'

services:
  # Main application service
  {{serviceName}}:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: {{serviceName}}-dev
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      {{#postgresql}}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/{{serviceName}}_dev
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      {{/postgresql}}
      {{#mysql}}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/{{serviceName}}_dev
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
      {{/mysql}}
      {{#h2}}
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:{{serviceName}}_dev
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      {{/h2}}
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics
    depends_on:
      {{#postgresql}}
      - postgres
      {{/postgresql}}
      {{#mysql}}
      - mysql
      {{/mysql}}
    volumes:
      - app-logs:/app/logs
    networks:
      - {{serviceName}}-dev-network
    restart: unless-stopped

  {{#postgresql}}
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: {{serviceName}}-postgres-dev
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    environment:
      - POSTGRES_DB={{serviceName}}_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - {{serviceName}}-dev-network
    restart: unless-stopped
  {{/postgresql}}

  {{#mysql}}
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: {{serviceName}}-mysql-dev
    ports:
      - "3307:3306"  # Different port to avoid conflicts
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE={{serviceName}}_dev
      - MYSQL_USER=dev_user
      - MYSQL_PASSWORD=password
    volumes:
      - mysql-dev-data:/var/lib/mysql
    networks:
      - {{serviceName}}-dev-network
    restart: unless-stopped
  {{/mysql}}

# Volumes for data persistence
volumes:
  {{#postgresql}}
  postgres-dev-data:
    driver: local
  {{/postgresql}}
  {{#mysql}}
  mysql-dev-data:
    driver: local
  {{/mysql}}
  app-logs:
    driver: local

# Networks
networks:
  {{serviceName}}-dev-network:
    driver: bridge