server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: {{serviceName}}

  profiles:
    active: dev

  datasource:
    {{#postgresql}}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:{{domain}}_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    {{/postgresql}}
    {{#mysql}}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:{{domain}}_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    {{/mysql}}
    {{#h2}}
    url: jdbc:h2:mem:{{domain}}_db
    username: sa
    password:
    driver-class-name: org.h2.Driver
    {{/h2}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    {{#postgresql}}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    {{/postgresql}}
    {{#mysql}}
    database-platform: org.hibernate.dialect.MySQL8Dialect
    {{/mysql}}
    {{#h2}}
    database-platform: org.hibernate.dialect.H2Dialect
    {{/h2}}
    hibernate:
      {{#hasFlyway}}
      ddl-auto: validate
      {{/hasFlyway}}
      {{^hasFlyway}}
      ddl-auto: create-drop
      {{/hasFlyway}}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  {{#hasFlyway}}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  {{/hasFlyway}}

  {{#h2}}
  h2:
    console:
      enabled: true
      path: /h2-console
  {{/h2}}

# Enterprise Framework Configuration
enterprise:
  framework:
    enabled: true
    jpa:
      auditing-enabled: true
    events:
      async-enabled: true
    pagination:
      default-page-size: 20
      max-page-size: 100
    entity:
      soft-delete-enabled: true
    validation:
      enabled: true
      fail-fast: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    defaults:
      enabled: true

{{#hasOpenApi}}
# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
  show-actuator: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  info:
    title: {{domainTitleCase}} API
    version: 1.0.0
    description: Enterprise microservice for {{domain}} management
    contact:
      name: API Support
      email: support@example.com
{{/hasOpenApi}}

# Logging Configuration
logging:
  level:
    root: INFO
    {{packageName}}: DEBUG
    {{packageName}}.enterprise.framework: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/{{serviceName}}.log
    max-size: 10MB
    max-history: 30
