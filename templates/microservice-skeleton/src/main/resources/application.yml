# {{serviceNameTitleCase}} Application Configuration
# Generated by Enterprise CLI on {{timestamp}}

server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: {{serviceName}}

  # Database Configuration
  datasource:
    url: {{databaseUrl}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: {{databaseDriverClass}}
    hikari:
      connection-timeout: 20000
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: {{#h2}}create-drop{{/h2}}{{^h2}}validate{{/h2}}
    properties:
      hibernate:
        dialect: {{databaseDialect}}
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        cache:
          use_second_level_cache: false
    show-sql: false

  {{#hasFlyway}}
  # Flyway Configuration
  flyway:
    enabled: {{^h2}}true{{/h2}}{{#h2}}false{{/h2}}
    baseline-on-migrate: true
    locations: classpath:db/migration
  {{/hasFlyway}}

  {{#hasAuth}}
  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/enterprise}
  {{/hasAuth}}

{{#hasMonitoring}}
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
{{/hasMonitoring}}

{{#hasOpenApi}}
# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  info:
    title: {{serviceNameTitleCase}} API
    description: Enterprise {{domainTitleCase}} Microservice API
    version: 1.0.0
    contact:
      name: API Support
      email: api-support@company.com
{{/hasOpenApi}}

{{#hasCamel}}
# Camel Configuration
camel:
  springboot:
    name: {{serviceName}}-camel-context
    shutdown-timeout: 30
  component:
    http:
      connection-timeout: 30000
      socket-timeout: 30000
{{/hasCamel}}

# Logging Configuration
logging:
  level:
    {{packageName}}: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Custom Application Properties
app:
  name: {{serviceNameTitleCase}}
  version: 1.0.0
  description: Enterprise {{domainTitleCase}} Microservice
  {{#legacyIntegration}}
  legacy:
    enabled: true
    timeout: 30000
    retry-attempts: 3
  {{/legacyIntegration}}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    {{#h2}}
    url: jdbc:h2:mem:{{serviceName}}_dev
    {{/h2}}
    {{#postgresql}}
    url: jdbc:postgresql://localhost:5432/{{serviceName}}_dev
    {{/postgresql}}
    {{#mysql}}
    url: jdbc:mysql://localhost:3306/{{serviceName}}_dev
    {{/mysql}}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    {{packageName}}: DEBUG
    root: INFO

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    {{packageName}}: INFO
    root: WARN