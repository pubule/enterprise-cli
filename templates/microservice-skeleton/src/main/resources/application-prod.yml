# Production Profile Configuration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  datasource:
    {{#postgresql}}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    {{/postgresql}}
    {{#mysql}}
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    {{/mysql}}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  {{#hasFlyway}}
  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false
  {{/hasFlyway}}

# Enterprise Framework - Prod Settings
enterprise:
  framework:
    validation:
      fail-fast: true  # Fail on first validation error for performance

# Actuator - Restricted Access in Prod
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: never
  metrics:
    export:
      prometheus:
        enabled: true
        step: 1m

# Logging - Minimal in Prod
logging:
  level:
    root: WARN
    {{packageName}}: INFO
    {{packageName}}.enterprise.framework: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n'
  file:
    name: /var/log/{{serviceName}}/application.log
    max-size: 100MB
    max-history: 90
    total-size-cap: 10GB
