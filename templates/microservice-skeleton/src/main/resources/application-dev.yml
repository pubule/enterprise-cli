# Development Profile Configuration

server:
  port: 8080

spring:
  datasource:
    {{#postgresql}}
    url: jdbc:postgresql://localhost:5432/{{domain}}_db_dev
    username: postgres
    password: postgres
    {{/postgresql}}
    {{#mysql}}
    url: jdbc:mysql://localhost:3306/{{domain}}_db_dev?useSSL=false
    username: root
    password: root
    {{/mysql}}
    {{#h2}}
    url: jdbc:h2:mem:{{domain}}_db_dev
    username: sa
    password:
    {{/h2}}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  {{#h2}}
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  {{/h2}}

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# Enterprise Framework - Dev Settings
enterprise:
  framework:
    validation:
      fail-fast: false  # Show all validation errors

# Actuator - Full Access in Dev
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
      show-components: always

# Logging - Verbose in Dev
logging:
  level:
    root: INFO
    {{packageName}}: DEBUG
    {{packageName}}.enterprise.framework: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx'
