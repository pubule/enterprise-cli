# Test Configuration for {{serviceNameTitleCase}}
# Generated by Enterprise CLI - optimized for testing environment

spring:
  application:
    name: {{serviceName}}-test

  # H2 In-Memory Database for Tests
  datasource:
    url: jdbc:h2:mem:{{serviceName}}_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connection-timeout: 5000
      minimum-idle: 1
      maximum-pool-size: 5

  # JPA Configuration for Tests
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 10
        cache:
          use_second_level_cache: false
    show-sql: false
    defer-datasource-initialization: true

  # Flyway Configuration for Tests
  flyway:
    enabled: false # Disabled for tests to use JPA DDL auto-creation

  # Security Configuration for Tests - Disabled for faster test execution

  # H2 Console for debugging (test only)
  h2:
    console:
      enabled: true
      path: /h2-console

# Disable Actuator endpoints in tests
management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: true

# Camel Configuration for Tests
camel:
  springboot:
    name: {{serviceName}}-test-camel-context
    shutdown-timeout: 5
  component:
    http:
      connection-timeout: 5000
      socket-timeout: 5000

# Logging Configuration for Tests
logging:
  level:
    {{packageName}}: DEBUG
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    org.apache.camel: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Test-specific Application Properties
app:
  name: {{serviceNameTitleCase}} Test
  version: 1.0.0-TEST
  description: Test configuration for {{domainTitleCase}} microservice
  test:
    data-initialization: true
    cleanup-after-test: true